        <section>
          <h2>About</h2>
          <p>Peter Hay is an independent strategic advisor and fractional advisor based in the UK. For over 20 years he has worked alongside senior leaders navigating complex change inside established organisations – when a product has lost momentum, a team is working hard but moving in the wrong direction, or a strategy that looked convincing on paper is struggling in practice.</p>
          <p>He works as a thinking partner: moving comfortably between the detail and the wider system around it, restoring clarity, direction and momentum when pushing harder is no longer the answer.</p>
          <p>His advisory work is strengthened by practical use of AI across customer enablement, research synthesis, workshop preparation, service blueprinting, rapid prototyping and decision support.</p>
        </section>

        <section>
          <h2>Where he can be most useful</h2>
          <ul>
            <li><strong>When the problem is not yet clear</strong> – Clarity on what is really happening beneath the surface</li>
            <li><strong>When direction feels uncertain</strong> – A clearer sense of what matters and where to focus next</li>
            <li><strong>When teams are working hard but progress is slow</strong> – Momentum restored without increasing pressure</li>
            <li><strong>When the situation is genuinely complex</strong> – Thoughtful decisions made with greater confidence</li>
          </ul>
          <p>Most engagements start with a short, focused discussion. From there, support may take the form of retained advisory, fractional involvement, or something more bespoke.</p>
        </section>

        <section>
          <h2>Selected clients</h2>
          <p>PepsiCo, Mastercard, Lloyds Commercial Bank, Southern Water, Calor Gas, Fulham Pier, The Big Issue.</p>
        </section>

        <section>
          <h2>Project highlights</h2>

          <article>
            <h3>PepsiCo – data trust and efficiency</h3>
            <p>R&amp;D teams relied on disconnected systems to access flavour and seasoning data. Peter mapped the system, identified duplication and trust breakdowns, and built a grounded business case. Outcome: 5,000+ hours of efficiency opportunity identified and a clear path towards a connected data ecosystem.</p>
          </article>

          <article>
            <h3>Mastercard – global product governance</h3>
            <p>Siloed teams across regions and no shared definition of success slowed product development across 12 global business units. Peter aligned the groups, defined Materiality, Velocity and Quality metrics, and removed friction from governance. Outcome: 3 years saved in development timelines and 70% global alignment achieved.</p>
          </article>

          <article>
            <h3>Lloyds Commercial Bank – commercial onboarding</h3>
            <p>A 6-month onboarding process for new commercial customers was underpinned by fragmented systems and poor customer experience. Peter introduced agile and lean experimentation and scaled solutions within a newly formed innovation lab. Outcome: onboarding reduced from 6 months to 7 days.</p>
          </article>

          <article>
            <h3>Southern Water – innovation capability</h3>
            <p>No internal innovation capability, slow delivery processes and rising pressure from ageing infrastructure. Peter co-designed and ran an innovation capability with a team of 12, launching live experiments within 3 months. Outcome: £25m savings and new ways of working adopted across the business.</p>
          </article>

          <article>
            <h3>Fulham Pier – digital placemaking</h3>
            <p>A major riverside destination had to be designed while construction was still under way. Peter translated the vision into a connected end-to-end digital experience spanning customer research, journey design, service blueprinting and product ownership.</p>
          </article>

          <article>
            <h3>Calor Gas – legacy process redesign</h3>
            <p>A core customer process unchanged since 1935 was misaligned with modern customer needs. Peter led customer-centric research, mapped the end-to-end journey and created new solution concepts, establishing a foundation for complete process redesign.</p>
          </article>

          <article>
            <h3>The Big Issue – digital and financial inclusion</h3>
            <p>Growing risk that vendors would be excluded from digital financial systems. Ethnographic research translated real barriers into a viable service model. Outcome: a beta product designed and a live pilot shipped to vendors in 10 weeks.</p>
          </article>
        </section>
